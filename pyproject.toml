[project]
name = "tgcs-utils"
version = "0.1.4"
description = "Python CLI utilities for David's Trail Guide System."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "cappa>=0.32.2",
    "requests>=2.34.2",
]

[project.scripts]
tgcs-utils = "tgcs_utils.main:main"

[dependency-groups]
dev = [
    "hatchling>=1.27.0",
    "ruff>=0.16.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
